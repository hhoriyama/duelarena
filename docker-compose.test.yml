# 結合テスト用 PostgreSQL
# 使い方:
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && npm run test:integration
#   docker compose -f docker-compose.test.yml down -v
services:
  test-db:
    image: postgres:16-alpine
    container_name: duel-arena-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: duel_arena_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d duel_arena_test"]
      interval: 2s
      timeout: 5s
      retries: 10
